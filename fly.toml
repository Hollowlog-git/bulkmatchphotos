# fly.toml app configuration file generated for bulk-photo-match2
# See https://fly.io/docs/reference/configuration/

app = 'bulk-photo-match2'
primary_region = 'syd'

[build]
  dockerfile = "Dockerfile"


[env]
  HOST = '0.0.0.0'
  PORT = '3000'
  SCOPES = 'write_products'
  SHOPIFY_APP_URL = 'https://bulk-photo-match2.fly.dev'
  # Absolute path on the persistent volume — avoids relying on Prisma's
  # relative "file:" path resolution (which resolves against the
  # schema.prisma directory, not cwd or root) ever silently pointing at
  # ephemeral container storage again.
  DATABASE_URL = 'file:/data/dev.sqlite'
  # Used to scope Trade Me sync rows — not a secret, just an identifier.
  # TRADEME_SYNC_SECRET (the actual auth credential for /api/trademe-sync)
  # must NOT go here — this file is committed to git. Set it with:
  #   fly secrets set TRADEME_SYNC_SECRET=<value> -a bulk-photo-match2
  SHOP_DOMAIN = 'xnbtjk-im.myshopify.com'

[processes]
  app = "npm run docker-start"


[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true

  # IMPORTANT: keep one machine running to avoid Shopify iframe timeouts
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
